<title>Cruzeiro do Sul · Painel We</title>
<style>
:root {
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 18px;
  --cds-radius: 10px;
  --cds-font-size-title: 28px; --cds-font-size-heading: 18px; --cds-font-size-body: 14px; --cds-font-size-caption: 12px;
  --cds-font-weight-medium: 600;
  --color-fg: #1a1d24; --color-fg-muted: #5c6680; --color-bg: #f4f5f8; --color-panel: #ffffff;
  --color-border-line: #e2e5ec; --color-ok: #1f8a4c; --color-warn: #b26a00;
}
html, body { margin: 0; background: var(--color-bg); }
.pg { max-width: 1200px; margin: 0 auto; padding: 24px 20px 48px; }
.pg-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 28px; color: var(--color-fg-muted); font: 12px var(--font-anthropic-sans); }
.pg-foot button { font: inherit; border: 1px solid var(--color-border-line); background: var(--color-panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: var(--color-fg); }
.dash-skeleton { background: var(--color-border-line); border-radius: 6px; min-width: 2ch; }
</style>

<body>
<div class="pg">
<script>
// Lê as abas publicadas da planilha (CSV) e entrega ao painel. Atualiza a cada 5 minutos.
window.CP_FONTES = {itens: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=0&single=true&output=csv', campanhas: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=1&single=true&output=csv', fases: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=2&single=true&output=csv', flights: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=3&single=true&output=csv', alertas: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=4&single=true&output=csv', midia: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT6CH4LZHS72BL0-dBpo6uvGx7BXy173eo4hqgUlxpYfNjPgLOs_ijetLoxir--7F3UbXBbMFnqLFsl/pub?gid=5&single=true&output=csv'};
window.dash = (function () {
  const loaders = {}, calcs = {}, draws = {}, state = {};
  function parseCSV(t) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
      else if (c !== '\r') f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  function drawAll() { Object.keys(draws).forEach((n) => api.draw(n)); }
  async function load() {
    const ids = Object.keys(window.CP_FONTES);
    await Promise.all(ids.map(async (id) => {
      try {
        const r = await fetch(window.CP_FONTES[id] + '&t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const values = parseCSV(await r.text());
        const out = loaders[id] ? loaders[id]({ answer: { values } }) : values;
        state[id] = { status: 'ok', data: out.rows || out };
      } catch (e) { if (!state[id] || state[id].status !== 'ok') state[id] = { status: 'error', data: [], message: String(e) }; }
    }));
    const el = document.getElementById('pg-hora');
    if (el) el.textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    drawAll();
  }
  const api = {
    loader(id, o) { loaders[id] = o.fn; },
    calc(id, o) { calcs[id] = o; },
    data(id) {
      if (calcs[id]) {
        const ins = calcs[id].inputs.map((x) => api.data(x));
        if (ins.some((d) => d.status === 'error')) return { status: 'error', data: null };
        if (ins.some((d) => d.status !== 'ok')) return { status: 'loading', data: null };
        try { return { status: 'ok', data: calcs[id].fn(...ins.map((d) => d.data)) }; } catch (e) { return { status: 'error', data: null }; }
      }
      return state[id] || { status: 'loading', data: [] };
    },
    draw(name, fn) {
      if (fn) draws[name] = fn;
      const el = document.querySelector('[data-draw="' + name + '"]');
      if (el && draws[name]) draws[name](el);
    },
    reload: load
  };
  window.addEventListener('DOMContentLoaded', () => { load(); setInterval(load, 5 * 60 * 1000); });
  return api;
})();
</script>

  fn: cpRead({'ID':'id','Campanha':'campanha','Tipo':'tipo','Status geral':'status','Início':'inicio','Fim':'fim','Visível ao cliente':'visivel','Observações':'obs','Nº do job':'job','Link Taskrow':'taskrow','Pasta de documentos':'pasta'})
});
dash.loader('fases', {
  description: 'Lê a aba Fases: a primeira linha vira o nome das colunas.',
  fn: cpRead({'ID':'id','Campanha':'campanha','Ordem':'ordem','Fase':'fase','Início':'inicio','Fim':'fim','Observações':'obs'})
});
dash.loader('flights', {
  description: 'Lê a aba Flights: a primeira linha vira o nome das colunas.',
  fn: cpRead({'ID':'id','Campanha':'campanha','Flight':'flight','Veículo / programa':'veiculo','Início':'inicio','Fim':'fim','Fases que toca':'fases','Formato':'formato','Praça':'praca','Observações':'obs'})
});

const cpVis = (item, campanhas) => {
  const c = campanhas.find((x) => x.campanha === item.campanha);
  return item.visivel !== 'Não' && !(c && c.visivel === 'Não');
};
const cpCount = (rs) => {
  const has = (s, k) => String(s || '').startsWith(k);
  const ab = rs.filter((r) => !has(r.status, 'Finalizado') && !has(r.status, 'Cancelado'));
  return { abertos: ab.length, em_execucao: rs.filter((r) => has(r.status, 'Em execução')).length, em_aprovacao: rs.filter((r) => has(r.status, 'Em aprovação')).length, aguardando: rs.filter((r) => has(r.status, 'Aguardando')).length, planejado: rs.filter((r) => has(r.status, 'Planejado')).length, com_cliente: ab.filter((r) => r.quem === 'Cruzeiro do Sul').length, com_we: ab.filter((r) => r.quem === 'We').length, finalizados: rs.filter((r) => has(r.status, 'Finalizado')).length, total: rs.length };
};
const cpAtiva = (c) => !/^(Finalizado|Cancelado)/.test(String(c.status || ''));
const cpAtivos = (itens, campanhas) => itens.filter((r) => { const c = campanhas.find((x) => x.campanha === r.campanha); return !c || cpAtiva(c); });
window.cpVis = cpVis;
window.cpAtiva = cpAtiva;

dash.calc('resumo', {
  inputs: ['itens', 'campanhas'],
  title: 'Resumo da conta',
  description: 'Itens por situação (em aberto = nem Finalizado nem Cancelado), só das campanhas ativas (Status geral diferente de Finalizado ou Cancelado) e dos itens visíveis nesta visão.',
  fn: (itens, campanhas) => [
    Object.assign({visao: window.CP_MODO}, cpCount(cpAtivos(window.CP_MODO === 'we' ? itens : itens.filter((r) => cpVis(r, campanhas)), campanhas)))
  ]
});
dash.calc('por_campanha', {
  inputs: ['itens', 'campanhas'],
  title: 'Itens por campanha',
  description: 'Para cada campanha ativa: em aberto, em aberto com a Cruzeiro do Sul, finalizados e total.',
  fn: (itens, campanhas) => {
    const base = cpAtivos(window.CP_MODO === 'we' ? itens : itens.filter((r) => cpVis(r, campanhas)), campanhas);
    return campanhas.filter(cpAtiva).map((c) => Object.assign({visao: window.CP_MODO, campanha: c.campanha}, cpCount(base.filter((r) => r.campanha === c.campanha))));
  }
});
dash.calc('por_fase', {
  inputs: ['itens', 'fases', 'campanhas'],
  title: 'Itens por fase',
  description: 'Para cada fase de cada campanha ativa: itens em aberto, finalizados e total.',
  fn: (itens, fases, campanhas) => {
    const base = cpAtivos(window.CP_MODO === 'we' ? itens : itens.filter((r) => cpVis(r, campanhas)), campanhas);
    return fases.map((f) => Object.assign({visao: window.CP_MODO, campanha: f.campanha, fase: f.fase}, cpCount(base.filter((r) => r.campanha === f.campanha && r.fase === f.fase))));
  }
});
dash.calc('por_area', {
  inputs: ['itens', 'campanhas'],
  title: 'Itens por área',
  description: 'Itens de cada departamento nas campanhas ativas. Itens sem departamento contam em “Sem área”.',
  fn: (itens, campanhas) => {
    const base = cpAtivos(window.CP_MODO === 'we' ? itens : itens.filter((r) => cpVis(r, campanhas)), campanhas);
    const ordem = ['Atendimento', 'Planejamento', 'Mídia', 'Criação', 'Conteúdo', 'Produção', 'Administrativo'];
    const found = [...new Set(base.map((r) => r.depto).filter(Boolean))];
    const areas = ordem.concat(found.filter((d) => !ordem.includes(d))).concat(['Sem área']);
    return areas.map((area) => Object.assign({visao: window.CP_MODO, area}, cpCount(base.filter((r) => (r.depto || 'Sem área') === area))));
  }
});
</script>

<script>
window.cpUI = window.cpUI || { modo: 'campanhas', visao: window.CP_MODO, campanha: null, fase: null, area: 'Planejamento', filtro: null };
try { if (window.CP_MODO === 'we' && /^#midia/.test(location.hash)) window.cpUI.modo = 'midia'; if (window.CP_MODO === 'we' && /^#alertas/.test(location.hash)) window.cpUI.modo = 'alertas'; } catch (e) {}
const U = window.cpUI;
const AREAS = ['Atendimento', 'Planejamento', 'Mídia', 'Criação', 'Conteúdo', 'Produção', 'Administrativo', 'Sem área'];

const has = (s, k) => String(s || '').startsWith(k);
const isOpen = (r) => !has(r.status, 'Finalizado') && !has(r.status, 'Cancelado');
const pDate = (s) => { const m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const short = (s) => { const d = pDate(s); return d ? s.slice(0, 5) : (s || ''); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
// Situação do prazo de um item em aberto: 'venc' (antes de hoje), 'hoje', 'prox' (próximos 7 dias) ou null.
const prazoSit = (r) => {
  if (!isOpen(r)) return null;
  const d = pDate(r.prazo); if (!d) return null;
  const n = Math.round((d - today()) / 86400000);
  return n < 0 ? 'venc' : n === 0 ? 'hoje' : n <= 7 ? 'prox' : null;
};
const diasAtraso = (r) => Math.round((today() - pDate(r.prazo)) / 86400000);
// Destaque de linha: vencido só na visão We; hoje nas duas.
const rowMark = (r) => { const s = prazoSit(r); return s === 'hoje' ? 'cp-hoje' : (s === 'venc' && U.visao === 'we') ? 'cp-venc' : ''; };
function prazoCell(r, compact) {
  const s = prazoSit(r);
  if (s === 'hoje') return el('td', 'n cp-pz-hoje', 'Hoje');
  if (s === 'venc' && U.visao === 'we') { const k = diasAtraso(r); const td = el('td', 'n cp-pz-venc', compact ? short(r.prazo) : short(r.prazo) + ' · há ' + k + (k === 1 ? ' dia' : ' dias')); td.title = 'Vencido há ' + k + (k === 1 ? ' dia' : ' dias'); return td; }
  return el('td', 'n', short(r.prazo) || '—');
}
const byPriority = (a, b) => {
  const da = pDate(a.prazo), db = pDate(b.prazo);
  if (da && db && da - db) return da - db;
  if (da && !db) return -1;
  if (!da && db) return 1;
  return String(a.id).localeCompare(String(b.id));
};
const enc = (v) => String(v).replace(/%/g, '%25').replace(/&/g, '%26').replace(/=/g, '%3D');
const where = (o) => Object.entries(o).map(([k, v]) => k + '=' + enc(v)).join('&');

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function num(src, field, w, val) { const b = el('b', null, val == null ? '—' : String(val)); b.dataset.source = src; b.dataset.field = field; b.dataset.where = where(w); return b; }
function pill(status) {
  return el('span', 'cp-pill ' + (has(status, 'Finalizado') ? 'ok' : (has(status, 'Em aprovação') || has(status, 'Aguardando')) ? 'warn' : has(status, 'Em execução') ? '' : 'muted'), status || 'Sem status');
}
function safeLink(label, url) { if (!url || !/^https?:\/\//.test(url)) return null; const a = el('a', null, label); a.href = url; a.target = '_blank'; a.rel = 'noopener'; return a; }
function veic(r) { return r.veic_ini ? (r.veic_fim && r.veic_fim !== r.veic_ini ? short(r.veic_ini) + ' a ' + short(r.veic_fim) : short(r.veic_ini)) : ''; }
function rerender() { dash.draw('nav'); dash.draw('vista'); dash.draw('tiles'); dash.draw('sino'); }
function go(patch) { Object.assign(U, patch); if ('modo' in patch) { try { history.replaceState(null, '', U.modo === 'midia' ? '#midia' : U.modo === 'alertas' ? '#alertas' : location.pathname + location.search); } catch (e) {} } rerender(); const v = document.getElementById('navegacao'); if (v && patch.scroll) v.scrollIntoView({block: 'start'}); }

function visibleItems(itens, campanhas) { return U.visao === 'we' ? itens : itens.filter((r) => window.cpVis(r, campanhas)); }
// Só campanhas ativas (Status geral diferente de Finalizado/Cancelado); Administrativo e Institucional primeiro.
function visibleCamps(campanhas) {
  const rank = (c) => (c.tipo === 'Administrativo' || c.campanha === 'Administrativo') ? 0 : (c.tipo === 'Institucional' || c.campanha === 'Institucional') ? 1 : 2;
  return campanhas.filter((c) => window.cpAtiva(c) && (U.visao === 'we' || c.visivel !== 'Não'))
    .map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
}

function itemTable(rows, opts) {
  opts = opts || {};
  const wrap = el('div', 'cp-wrap');
  const t = el('table'); t.dataset.source = 'itens'; t.dataset.rowKey = 'id';
  const cols = [['item', 'O quê'], ['quem', 'Com quem'], ['status', 'Status'], ['prazo', 'Prazo']];
  if (opts.veic) cols.push(['veic_ini', 'No ar']);
  if (U.visao === 'we') cols.push(['job', 'Links']);
  const hr = el('tr'); cols.forEach(([f, l]) => { const th = el('th', null, l); th.dataset.field = f; hr.appendChild(th); });
  const thead = el('thead'); thead.appendChild(hr); t.appendChild(thead);
  const tb = el('tbody');
  rows.forEach((r) => {
    const tr = el('tr'); tr.dataset.key = r.id; const mk = rowMark(r); if (mk) tr.className = mk;
    const td = el('td', 'it');
    const l1 = el('div');
    l1.appendChild(document.createTextNode(r.item));
    td.appendChild(l1);
    const ctx = [opts.camp ? r.campanha : null, opts.fase ? (r.fase || (r.flight ? 'Flight inteiro' : '')) : null, r.acao].filter(Boolean).join(' · ');
    if (ctx) td.appendChild(el('div', 'cp-muted cp-small', ctx));
    const nota = r.proximo ? 'Próximo passo: ' + r.proximo : r.descritivo;
    if (nota) td.appendChild(el('div', 'cp-muted cp-small', nota));
    if (U.visao === 'we' && r.falta && isOpen(r)) td.appendChild(el('div', 'cp-falta', 'Falta informar: ' + r.falta.replace(/;\s*$/, '')));
    tr.appendChild(td);
    tr.appendChild(el('td', null, r.quem || '—'));
    const ts = el('td'); ts.appendChild(pill(r.status)); tr.appendChild(ts);
    tr.appendChild(prazoCell(r));
    if (opts.veic) tr.appendChild(el('td', 'n', veic(r)));
    if (U.visao === 'we') {
      const tl = el('td', 'cp-links cp-small');
      [safeLink('Taskrow', r.taskrow), safeLink('Ativos', r.ativos)].forEach((a) => a && tl.appendChild(a));
      if (r.job) tl.appendChild(el('span', 'cp-muted', 'Job ' + r.job));
      tr.appendChild(tl);
    }
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}
function openAndDone(rows, opts) {
  const frag = el('div', 'cp-group');
  const ab = rows.filter(isOpen).sort(byPriority);
  const fin = rows.filter((r) => !isOpen(r));
  if (ab.length) frag.appendChild(itemTable(ab, opts));
  else frag.appendChild(el('p', 'cp-empty', 'Nada em aberto aqui.'));
  if (fin.length) {
    const d = el('details'); d.appendChild(el('summary', null, 'Entregues e cancelados (' + fin.length + ')'));
    d.appendChild(itemTable(fin, opts)); frag.appendChild(d);
  }
  return frag;
}
function msg(text) { return el('p', 'cp-empty', text); }

const FILTROS = [
  ['abertos', 'Em aberto', isOpen],
  ['em_execucao', 'Em execução', (r) => has(r.status, 'Em execução')],
  ['em_aprovacao', 'Em aprovação', (r) => has(r.status, 'Em aprovação')],
  ['aguardando', 'Aguardando', (r) => has(r.status, 'Aguardando')],
  ['planejado', 'Planejado', (r) => has(r.status, 'Planejado')],
  ['com_cliente', 'Aguardando a Cruzeiro do Sul', (r) => isOpen(r) && r.quem === 'Cruzeiro do Sul'],
  ['com_we', 'Com a We', (r) => isOpen(r) && r.quem === 'We'],
  ['finalizados', 'Entregues', (r) => has(r.status, 'Finalizado')]
];
const FILTROS_PRAZO = [
  ['vencidos', 'Vencidos', (r) => prazoSit(r) === 'venc'],
  ['hoje', 'Hoje', (r) => prazoSit(r) === 'hoje'],
  ['proximos', 'Próximos 7 dias', (r) => prazoSit(r) === 'prox']
];
window.cpFiltros = FILTROS.concat(FILTROS_PRAZO);

dash.calc('prazos', {
  inputs: ['itens', 'campanhas'],
  title: 'Prazos',
  description: 'Itens em aberto (nem Finalizado nem Cancelado) das campanhas ativas visíveis nesta visão, pelo prazo: vencidos (antes de hoje), hoje e próximos 7 dias corridos; cada grupo dividido entre We e Cruzeiro do Sul. Itens sem prazo não contam.',
  fn: (itens, campanhas) => {
    const base = cpAtivos(window.CP_MODO === 'we' ? itens : itens.filter((r) => cpVis(r, campanhas)), campanhas);
    const out = { visao: window.CP_MODO };
    [['vencidos', 'venc'], ['hoje', 'hoje'], ['proximos', 'prox']].forEach(([k, s]) => {
      const g = base.filter((r) => prazoSit(r) === s);
      out[k] = g.length; out[k + '_we'] = g.filter((r) => r.quem === 'We').length; out[k + '_cliente'] = g.filter((r) => r.quem === 'Cruzeiro do Sul').length;
    });
    return [out];
  }
});

function tileBtn(k, label, src, row, status, cls, sub) {
  const b = el('button', 'cp-tile' + (cls ? ' ' + cls : '')); b.type = 'button'; b.id = 'tile-' + k;
  b.setAttribute('aria-pressed', U.filtro === k ? 'true' : 'false');
  b.title = 'Ver a lista: ' + label;
  const v = el('span', 'cp-tile-v' + (status === 'loading' ? ' dash-skeleton' : ''), row ? String(row[k]) : (status === 'loading' ? '' : '—'));
  v.dataset.source = src; v.dataset.field = k; v.dataset.row = '0';
  b.append(v, el('span', 'cp-tile-l', label));
  if (sub) b.appendChild(sub);
  b.onclick = () => go({ filtro: U.filtro === k ? null : k, campanha: null, fase: null, scroll: true });
  return b;
}
function splitLine(row, k) {
  if (!row) return null;
  const s = el('span', 'cp-tile-s');
  const we = el('b', null, String(row[k + '_we'])); we.dataset.source = 'prazos'; we.dataset.field = k + '_we'; we.dataset.row = '0';
  const cl = el('b', null, String(row[k + '_cliente'])); cl.dataset.source = 'prazos'; cl.dataset.field = k + '_cliente'; cl.dataset.row = '0';
  s.append(we, ' com a We · ', cl, ' com a Cruzeiro');
  return s;
}
dash.draw('tiles', (box) => {
  const d = dash.data('resumo'), dp = dash.data('prazos');
  const row = d.status === 'ok' && d.data ? d.data[0] : null;
  const prow = dp.status === 'ok' && dp.data ? dp.data[0] : null;
  const fim = new Date(today().getTime() + 7 * 86400000);
  const ate = el('span', 'cp-tile-s', 'até ' + String(fim.getDate()).padStart(2, '0') + '/' + String(fim.getMonth() + 1).padStart(2, '0'));
  const pz = el('div', 'cp-tiles-row cp-tiles-prazo');
  if (U.visao === 'we') pz.appendChild(tileBtn('vencidos', 'Vencidos', 'prazos', prow, dp.status, 'venc', splitLine(prow, 'vencidos')));
  pz.appendChild(tileBtn('hoje', 'Hoje', 'prazos', prow, dp.status, 'hoje', U.visao === 'we' ? splitLine(prow, 'hoje') : null));
  pz.appendChild(tileBtn('proximos', 'Próximos 7 dias', 'prazos', prow, dp.status, '', U.visao === 'we' ? splitLine(prow, 'proximos') : ate));
  if (U.visao === 'we') pz.lastChild.appendChild(ate);
  const st = el('div', 'cp-tiles-row cp-tiles-status');
  FILTROS.forEach(([k, label]) => st.appendChild(tileBtn(k, label, 'resumo', row, d.status, '', null)));
  box.replaceChildren(el('div', 'cp-tiles-cap', 'Prazos (itens em aberto)'), pz, el('div', 'cp-tiles-cap', 'Por status'), st);
});

dash.draw('nav', (box) => {
  const seg = el('div', 'cp-seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Ver por');
  [['campanhas', 'Campanhas'], ['areas', 'Departamentos']].concat(U.visao === 'we' ? [['midia', 'No ar']] : []).forEach(([k, l]) => {
    const b = el('button', null, l); b.type = 'button'; b.setAttribute('aria-pressed', U.modo === k && !U.filtro ? 'true' : 'false');
    b.onclick = () => go({ modo: k, campanha: null, fase: null, filtro: null }); seg.appendChild(b);
  });
  box.replaceChildren(seg);
});

dash.draw('vista', (box) => {
  const di = dash.data('itens'), dc = dash.data('campanhas'), df = dash.data('fases'), dfl = dash.data('flights');
  const all = [di, dc, df, dfl];
  if (all.some((d) => d.status === 'error')) return box.replaceChildren(msg('Não foi possível ler a planilha agora.'));
  if (all.some((d) => d.status !== 'ok')) return box.replaceChildren(msg('Carregando a planilha…'));
  const campanhas = visibleCamps(dc.data);
  const itens = visibleItems(di.data, dc.data).filter((r) => campanhas.some((c) => c.campanha === r.campanha) || !r.campanha);
  const fases = df.data, flights = dfl.data.filter((f) => campanhas.some((c) => c.campanha === f.campanha));
  const pc = dash.data('por_campanha'), pf = dash.data('por_fase'), pa = dash.data('por_area');
  const cnt = (d, w) => (d.status === 'ok' && d.data ? d.data.find((x) => Object.entries(w).every(([k, v]) => x[k] === v)) : null) || {};
  if (U.filtro) return box.replaceChildren(filtroView(itens, campanhas));
  if (U.modo === 'areas') return box.replaceChildren(areasView(itens, campanhas, flights, pa, cnt));
  if (U.modo === 'midia' && U.visao === 'we') return box.replaceChildren(midiaView(itens, campanhas));
  if (U.modo === 'alertas' && U.visao === 'we') return box.replaceChildren(alertasView());
  if (U.campanha && campanhas.some((c) => c.campanha === U.campanha)) return box.replaceChildren(campanhaView(itens, campanhas, fases, flights, pf, cnt));
  box.replaceChildren(homeView(itens, campanhas, pc, cnt));
});

function homeView(itens, campanhas, pc, cnt) {
  const out = el('div', 'cp-grid'); out.id = 'campanhas';
  const t = today();
  campanhas.forEach((c) => {
    const rs = itens.filter((r) => r.campanha === c.campanha);
    const w = { visao: U.visao, campanha: c.campanha };
    const k = cnt(pc, w);
    const card = el('div', 'cp-card'); card.id = 'camp-' + (c.id || c.campanha);
    const head = el('div', 'cp-card-head'); head.appendChild(el('h2', null, c.campanha));
    if (c.inicio || c.fim) head.appendChild(el('span', 'cp-muted cp-small', [short(c.inicio), short(c.fim)].filter(Boolean).join(' a ')));
    card.appendChild(head);
    const p = el('div', 'cp-counts');
    p.append(num('por_campanha', 'abertos', w, k.abertos), ' em aberto · ', num('por_campanha', 'com_cliente', w, k.com_cliente), ' aguardando a Cruzeiro do Sul · ', num('por_campanha', 'finalizados', w, k.finalizados), ' entregues');
    card.appendChild(p);
    const ab = rs.filter(isOpen).sort(byPriority);
    const next = ab.filter((r) => pDate(r.prazo) && pDate(r.prazo) >= t).sort((a, b) => pDate(a.prazo) - pDate(b.prazo))[0];
    if (next) card.appendChild(el('div', 'cp-small', 'Próximo prazo: ' + short(next.prazo) + ' · ' + next.item));
    if (ab.length) {
      const list = el('div', 'cp-wrap'); const tb = el('table'); tb.dataset.source = 'itens'; tb.dataset.rowKey = 'id';
      const hr = el('tr'); [['item', 'Em aberto'], ['quem', 'Com quem'], ['prazo', 'Prazo']].forEach(([f, l]) => { const th = el('th', null, l); th.dataset.field = f; hr.appendChild(th); });
      const th = el('thead'); th.appendChild(hr); tb.appendChild(th);
      const body = el('tbody');
      ab.slice(0, 5).forEach((r) => { const tr = el('tr'); tr.dataset.key = r.id; const mk = rowMark(r); if (mk) tr.className = mk; tr.append(el('td', 'it', r.item), el('td', null, r.quem || '—'), prazoCell(r, true)); body.appendChild(tr); });
      tb.appendChild(body); list.appendChild(tb); card.appendChild(list);
      if (ab.length > 5) card.appendChild(el('div', 'cp-muted cp-small', '+ ' + (ab.length - 5) + ' itens em aberto'));
    } else card.appendChild(msg('Nada em aberto.'));
    const b = el('button', 'cp-link', 'Abrir campanha'); b.type = 'button';
    b.onclick = () => go({ campanha: c.campanha, fase: null, filtro: null, scroll: true });
    card.appendChild(b);
    out.appendChild(card);
  });
  return out;
}

  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>';
  if (k) { const s = el('span', 'cp-sino-badge', k > 99 ? '99+' : String(k)); s.dataset.source = 'alertas_abertos'; b.appendChild(s); }

});

function campanhaView(itens, campanhas, fases, flights, pf, cnt) {
  const c = campanhas.find((x) => x.campanha === U.campanha);
  const out = el('div', 'cp-group'); out.id = 'campanha';
  const back = el('button', 'cp-link', '← Todas as campanhas'); back.type = 'button'; back.onclick = () => go({ campanha: null, fase: null });
  out.appendChild(back);
  const head = el('div', 'cp-card-head'); head.appendChild(el('h2', null, c.campanha));
  if (c.inicio || c.fim) head.appendChild(el('span', 'cp-muted', [short(c.inicio), short(c.fim)].filter(Boolean).join(' a ')));
  out.appendChild(head);
  if (c.obs) out.appendChild(el('p', 'cp-muted', c.obs));
  if (U.visao === 'we') {
    const l = el('div', 'cp-links cp-small');
    [safeLink('Pasta de documentos', c.pasta), safeLink('Taskrow', c.taskrow)].forEach((a) => a && l.appendChild(a));
    if (c.job) l.appendChild(el('span', 'cp-muted', 'Job ' + c.job));
    if (l.childNodes.length) out.appendChild(l);
  }
  const rs = itens.filter((r) => r.campanha === c.campanha);
  const fs = fases.filter((f) => f.campanha === c.campanha).sort((a, b) => (+a.ordem || 0) - (+b.ordem || 0));
  const semFase = rs.filter((r) => !r.fase && !r.flight);
  const opts = fs.map((f) => f.fase).concat(semFase.length ? ['Campanha toda'] : []);
  const atual = faseAtual(fs, rs);
  if (!U.fase || !opts.includes(U.fase)) U.fase = atual || opts[0] || null;
  if (fs.length > 1 || semFase.length) {
    const chips = el('div', 'cp-chips'); chips.id = 'fases'; chips.setAttribute('role', 'group'); chips.setAttribute('aria-label', 'Fases');
    fs.forEach((f) => {
      const w = { visao: U.visao, campanha: c.campanha, fase: f.fase };
      const k = cnt(pf, w);
      const b = el('button', 'cp-chip'); b.type = 'button'; b.setAttribute('aria-pressed', U.fase === f.fase ? 'true' : 'false');
      const nm = el('b', null, f.fase);
      if (f.fase === atual) { nm.append(' '); nm.appendChild(el('span', 'cp-agora', '● agora')); }
      b.appendChild(nm);
      const dt = [short(f.inicio), short(f.fim)].filter(Boolean);
      if (dt.length) b.appendChild(el('span', 'cp-muted', dt[0] === dt[1] ? dt[0] : dt.join(' a ')));
      const s = el('span', 'cp-muted'); s.append(num('por_fase', 'abertos', w, k.abertos), ' em aberto de ', num('por_fase', 'total', w, k.total));
      b.appendChild(s);
      b.onclick = () => go({ fase: f.fase }); chips.appendChild(b);
    });
    if (semFase.length) {
      const b = el('button', 'cp-chip'); b.type = 'button'; b.setAttribute('aria-pressed', U.fase === 'Campanha toda' ? 'true' : 'false');
      b.appendChild(el('b', null, 'Campanha toda')); b.appendChild(el('span', 'cp-muted', semFase.filter(isOpen).length + ' em aberto'));
      b.onclick = () => go({ fase: 'Campanha toda' }); chips.appendChild(b);
    }
    out.appendChild(chips);
  }
  const card = el('div', 'cp-card'); card.id = 'fase';
  const f = fs.find((x) => x.fase === U.fase);
  if (fs.length > 1 || U.fase === 'Campanha toda') card.appendChild(el('h3', null, U.fase));
  if (f && f.obs) card.appendChild(el('div', 'cp-muted cp-small', f.obs));
  const fr = U.fase === 'Campanha toda' ? semFase : rs.filter((r) => r.fase === U.fase);
  card.appendChild(openAndDone(fr, { veic: fr.some((r) => r.veic_ini) }));
  out.appendChild(card);
  const fls = flights.filter((x) => x.campanha === c.campanha);
  if (fls.length) {
    const fc = el('div', 'cp-card'); fc.id = 'flights';
    fc.appendChild(el('h3', null, 'Mídia · flights'));
    fc.appendChild(el('div', 'cp-muted cp-small', 'Cada flight aparece uma vez, mesmo quando atravessa mais de uma fase.'));
    fls.forEach((x) => fc.appendChild(flightBlock(x, rs)));
    out.appendChild(fc);
  }
  return out;
}

// Fase em que estamos agora: pelas datas da aba Fases; sem datas, a última fase (pela Ordem) que já tem item iniciado.
function faseAtual(fs, rs) {
  if (!fs.length) return null;
  const t = today();
  const dated = fs.filter((f) => pDate(f.inicio));
  if (dated.length) {
    const now = dated.filter((f) => pDate(f.inicio) <= t && (!pDate(f.fim) || pDate(f.fim) >= t));
    if (now.length) return now.sort((a, b) => pDate(b.inicio) - pDate(a.inicio))[0].fase;
    const next = dated.filter((f) => pDate(f.inicio) > t).sort((a, b) => pDate(a.inicio) - pDate(b.inicio))[0];
    const past = dated.filter((f) => pDate(f.inicio) <= t).sort((a, b) => pDate(b.inicio) - pDate(a.inicio))[0];
    if (next) return next.fase;
    if (past) return past.fase;
  }
  const started = fs.filter((f) => rs.some((r) => r.fase === f.fase && r.status && !has(r.status, 'Planejado') && !has(r.status, 'Cancelado')));
  if (started.length) return started[started.length - 1].fase;
  return fs[0].fase;
}

function filtroView(itens, campanhas) {
  const f = window.cpFiltros.find((x) => x[0] === U.filtro);
  const out = el('div', 'cp-group'); out.id = 'filtro';
  const back = el('button', 'cp-link', '← Voltar'); back.type = 'button'; back.onclick = () => go({ filtro: null });
  out.appendChild(back);
  const rows = itens.filter(f[2]);
  const head = el('div', 'cp-card-head'); head.appendChild(el('h2', null, f[1]));
  const n = el('span', 'cp-counts'); const nb = el('b', null, String(rows.length)); nb.dataset.source = FILTROS_PRAZO.some((x) => x[0] === f[0]) ? 'prazos' : 'resumo'; nb.dataset.field = f[0]; nb.dataset.row = '0';
  n.append(nb, rows.length === 1 ? ' item' : ' itens');

    const cr = rows.filter((r) => r.campanha === c.campanha).sort(byPriority);
    if (!cr.length) return;
    const card = el('div', 'cp-card'); card.id = 'filtro-' + (c.id || c.campanha);
    const h = el('div', 'cp-card-head'); h.appendChild(el('h3', null, c.campanha)); h.appendChild(el('span', 'cp-muted cp-small', cr.length + (cr.length === 1 ? ' item' : ' itens')));
    card.appendChild(h);
    card.appendChild(itemTable(cr, { fase: true, veic: cr.some((r) => r.veic_ini) }));
    const ab = el('button', 'cp-link cp-small', 'Abrir campanha'); ab.type = 'button';
    ab.onclick = () => go({ campanha: c.campanha, fase: null, filtro: null, modo: 'campanhas', scroll: true });
    card.appendChild(ab);
    out.appendChild(card);
  });
  return out;
}

function flightBlock(x, rs) {
  const b = el('div', 'cp-flight'); b.id = 'flight-' + x.id;
  b.appendChild(el('h3', null, x.flight));
  const dt = [short(x.inicio), short(x.fim)].filter(Boolean).join(' a ');
  b.appendChild(el('div', 'cp-muted cp-small', [x.veiculo, dt, x.formato, x.praca].filter(Boolean).join(' · ')));
  if (x.fases) b.appendChild(el('div', 'cp-small', 'Fases: ' + x.fases.replace(/;\s*/g, ' + ')));
  if (x.obs) b.appendChild(el('div', 'cp-muted cp-small', x.obs));
  const fr = rs.filter((r) => r.flight === x.flight);
  if (fr.length) b.appendChild(openAndDone(fr, { fase: true, veic: true }));
  return b;
}

function areasView(itens, campanhas, flights, pa, cnt) {
  const out = el('div', 'cp-group'); out.id = 'areas';
  const chips = el('div', 'cp-chips'); chips.setAttribute('role', 'group'); chips.setAttribute('aria-label', 'Departamentos');
  const AR = pa.status === 'ok' && pa.data ? pa.data.map((x) => x.area) : AREAS;
  const vis = AR.filter((a) => cnt(pa, { visao: U.visao, area: a }).total);
  if (vis.length && !vis.includes(U.area)) U.area = vis[0];
  vis.forEach((a) => {
    const w = { visao: U.visao, area: a };
    const k = cnt(pa, w);
    const b = el('button', 'cp-chip'); b.type = 'button'; b.setAttribute('aria-pressed', U.area === a ? 'true' : 'false');
    b.appendChild(el('b', null, a));
    const s = el('span', 'cp-muted'); s.append(num('por_area', 'abertos', w, k.abertos), ' em aberto'); b.appendChild(s);
    b.onclick = () => go({ area: a }); chips.appendChild(b);
  });
  out.appendChild(chips);
  const rs = itens.filter((r) => (r.depto || 'Sem área') === U.area);
  if (U.area === 'Mídia' && flights.length) {
    const fc = el('div', 'cp-card'); fc.id = 'flights-midia';
    fc.appendChild(el('h3', null, 'Flights'));
    flights.forEach((x) => fc.appendChild(flightBlock(x, itens.filter((r) => r.campanha === x.campanha))));
    out.appendChild(fc);
  }
  let any = false;
  campanhas.forEach((c) => {
    const cr = rs.filter((r) => r.campanha === c.campanha);
    if (!cr.length) return;
    any = true;
    const card = el('div', 'cp-card'); card.id = 'area-' + (c.id || c.campanha);
    card.appendChild(el('h3', null, c.campanha));
    card.appendChild(openAndDone(cr, { fase: true }));
    out.appendChild(card);
  });
  if (!any) out.appendChild(msg('Nenhum item nesta área.'));
  return out;
}
// Tela Mídia (só We): o que o time de Mídia está fazendo, o que deve e o que aconteceu.
function midiaView(itens, campanhas) {
  const out = el('div', 'cp-group'); out.id = 'midia';
  const dm = dash.data('midia');
  const hist = dm.status === 'ok' ? dm.data.slice() : [];
  const byId = {};
  hist.forEach((h) => { (byId[h.id] = byId[h.id] || []).push(h); });
  Object.values(byId).forEach((l) => l.sort((a, b) => (pDate(b.data) || 0) - (pDate(a.data) || 0)));
  const rs = itens.filter((r) => r.depto === 'Mídia' || byId[r.id]);
  const t = today();
  // No ar: veiculação em curso hoje, com o trabalho da agência entregue (Finalizado) ou ainda em execução.
  const noAr = (r) => !has(r.status, 'Cancelado') && pDate(r.veic_ini) && pDate(r.veic_ini) <= t && (!pDate(r.veic_fim) || pDate(r.veic_fim) >= t) && (!isOpen(r) || has(r.status, 'Em execução'));
  const head = el('div', 'cp-card-head'); head.appendChild(el('h2', null, 'Mídia'));
  head.appendChild(el('span', 'cp-muted cp-small', 'O que o time de Mídia está fazendo, o que está devendo e o histórico de cada demanda'));
  out.appendChild(head);
  if (dm.status === 'error') out.appendChild(el('p', 'cp-falta', 'Não consegui ler o histórico de Mídia agora; mostrando só os itens.'));
  const grupos = [
    ['devendo', 'Com a We: cobrar ou ajudar', (r) => isOpen(r) && !noAr(r) && r.quem !== 'Cruzeiro do Sul'],
    ['cliente', 'Aguardando a Cruzeiro do Sul', (r) => isOpen(r) && !noAr(r) && r.quem === 'Cruzeiro do Sul'],
    ['noar', 'No ar agora: só acompanhar', noAr]
  ];
  const grid = el('div', 'cp-grid');
  grupos.forEach(([k, label, fn]) => {
    const g = rs.filter(fn).sort(byPriority);
    const card = el('div', 'cp-card'); card.id = 'midia-' + k;
    const h = el('h3', null, label + ' '); h.appendChild(el('span', 'cp-sec-n', '(' + g.length + ')')); card.appendChild(h);
    if (!g.length) card.appendChild(msg('Nada aqui.'));
    g.forEach((r) => card.appendChild(midiaRow(r, byId[r.id] || [])));
    grid.appendChild(card);
  });
  out.appendChild(grid);
  // Últimas movimentações
  const feed = el('div', 'cp-card'); feed.id = 'midia-feed';
  feed.appendChild(el('h3', null, 'Últimas movimentações'));
  if (dm.status === 'loading') feed.appendChild(msg('Carregando…'));
  const idsItens = new Set(itens.map((r) => r.id));
  const ult = hist.filter((x) => idsItens.has(x.id)).sort((a, b) => (pDate(b.data) || 0) - (pDate(a.data) || 0)).slice(0, 12);
  if (dm.status === 'ok' && !ult.length) feed.appendChild(msg('Nenhuma movimentação registrada.'));
  if (ult.length) {
    const ul = el('ul', 'cp-hist');
    ult.forEach((x) => {
      const li = el('li'); li.appendChild(el('span', 'd', short(x.data)));
      li.appendChild(el('b', null, (x.demanda || x.id) + ': '));
      li.appendChild(document.createTextNode(x.evento));
      if (x.origem) li.appendChild(el('span', 'o', ' · ' + x.origem));
      ul.appendChild(li);
    });
    feed.appendChild(ul);
  }
  out.appendChild(feed);
  const fin = rs.filter((r) => !isOpen(r) && !noAr(r));
  if (fin.length) {
    const d = el('details'); d.appendChild(el('summary', null, 'Entregues e cancelados (' + fin.length + ')'));
    const c = el('div', 'cp-card'); fin.forEach((r) => c.appendChild(midiaRow(r, byId[r.id] || []))); d.appendChild(c);
    out.appendChild(d);
  }
  return out;
}
function midiaRow(r, hs) {
  const row = el('div', 'cp-mrow' + (rowMark(r) ? ' ' + rowMark(r) : '')); row.dataset.source = 'itens'; row.dataset.key = r.id;
  const h = el('div', 'cp-mhead');
  const l = el('div'); l.appendChild(el('b', null, r.item));
  l.appendChild(el('div', 'cp-muted cp-small', [r.campanha, r.depto && r.depto !== 'Mídia' ? r.depto : null, r.id].filter(Boolean).join(' · ')));
  h.appendChild(l);
  const rt = el('div', 'cp-small'); rt.appendChild(pill(r.status));
  const dt = r.veic_ini ? 'No ar ' + veic(r) : (r.prazo ? 'Prazo ' + short(r.prazo) : '');
  if (dt) rt.appendChild(el('span', 'cp-muted', ' ' + dt));
  h.appendChild(rt); row.appendChild(h);
  if (r.proximo) row.appendChild(el('div', 'cp-small', 'Próximo passo: ' + r.proximo + (r.quem ? ' (' + r.quem + ')' : '')));
  if (hs.length) {
    const d = el('details'); d.appendChild(el('summary', null, 'Última: ' + short(hs[0].data) + ' · ' + hs[0].evento + (hs.length > 1 ? ' · ver histórico (' + hs.length + ')' : '')));
    const ul = el('ul', 'cp-hist');
    hs.forEach((x) => { const li = el('li'); li.appendChild(el('span', 'd', short(x.data))); li.appendChild(document.createTextNode(x.evento)); if (x.origem) li.appendChild(el('span', 'o', ' · ' + x.origem)); ul.appendChild(li); });
    d.appendChild(ul); row.appendChild(d);
  } else if (r.descritivo) row.appendChild(el('div', 'cp-muted cp-small', r.descritivo));
  return row;
}
